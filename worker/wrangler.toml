name = "jothidarjothi"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ═══════════════════════════════════════════════════════════════════
# ஜோதிட நிபுணர் — Secure API Gateway (Cloudflare Worker)
# ═══════════════════════════════════════════════════════════════════
# ALL astrology logic runs here, server-side. The browser only ever
# receives computed OUTPUT — never the engine code.
#
# Secrets are NOT stored in this file. Set them once with:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GEMINI_API_KEY            # Google AI Studio key (AI பலன் / chat)  ← REQUIRED when AI_PROVIDER="gemini"
#   wrangler secret put ANTHROPIC_API_KEY         # Claude key (alternative AI provider)
#   wrangler secret put RAZORPAY_KEY_ID           # premium ₹49 answer (optional — /api/order, /api/ask-premium)
#   wrangler secret put RAZORPAY_KEY_SECRET       # premium ₹49 answer (optional)
#   wrangler secret put INTERNAL_TOKEN            # shared with the Python backend (optional)
#   wrangler secret put SWISS_BACKEND_URL         # https://jothida-api.onrender.com  (optional, high precision)
#
# NOTE: FIREBASE_PROJECT_ID is a PUBLIC var (below), NOT a secret.
#
# ── What each feature needs ──────────────────────────────────────────
#   Core (ஜாதகம், தினப்பலன், porutham …) : nothing beyond the [vars] below
#   Chat / AI பலன் (ஆலோசனை)              : GEMINI_API_KEY  (+ AI_PROVIDER="gemini")
#   AI OFF chat (rule-based)              : nothing — works offline of any LLM
#   Premium ₹49 ஆழமான பதில்              : RAZORPAY_KEY_ID + RAZORPAY_KEY_SECRET
# Public, non-secret config goes under [vars] below.
# ═══════════════════════════════════════════════════════════════════

[vars]
# Firebase project that mints the ID tokens (public, not a secret).
FIREBASE_PROJECT_ID = "jothidar-d1c8c"

# Comma-separated list of allowed browser origins (NO trailing slash).
# Only these sites may call the API. Add your production domain(s).
ALLOWED_ORIGINS = "https://jothidanipunar.com,https://jothida-nipunar.pages.dev,http://localhost:5173"

# Which ephemeris to use by default: "meeus" (in-Worker JS, fully self-contained)
# or "swiss" (proxy the high-precision Python backend, requires SWISS_BACKEND_URL).
EPHEMERIS_MODE = "meeus"

# AI provider: "claude" (default) or "gemini".
# Set the matching secret: wrangler secret put ANTHROPIC_API_KEY  (Claude)
#                          wrangler secret put GEMINI_API_KEY      (Gemini)
AI_PROVIDER = "gemini"

# KV is OPTIONAL. The Worker runs fine without it (JWKS cached in memory,
# rate-limiting falls back to Cloudflare's edge). To enable per-user rate
# limiting + shared JWKS cache later, create a namespace
#   (Dashboard → Storage & Databases → KV → Create, name it RL)
# then uncomment the two lines below and paste its id:
# [[kv_namespaces]]
# binding = "RL"
# id = "PASTE_KV_NAMESPACE_ID"

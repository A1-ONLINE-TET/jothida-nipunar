name = "jothida-nipunar-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ═══════════════════════════════════════════════════════════════════
# ஜோதிட நிபுணர் — Secure API Gateway (Cloudflare Worker)
# ═══════════════════════════════════════════════════════════════════
# ALL astrology logic runs here, server-side. The browser only ever
# receives computed OUTPUT — never the engine code.
#
# Secrets are NOT stored in this file. Set them once with:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put INTERNAL_TOKEN            # shared with the Python backend
#   wrangler secret put FIREBASE_PROJECT_ID       # e.g. jothida-nipunar
#   wrangler secret put SWISS_BACKEND_URL         # https://jothida-api.onrender.com  (optional, high precision)
#
# Public, non-secret config goes under [vars] below.
# ═══════════════════════════════════════════════════════════════════

[vars]
# Comma-separated list of allowed browser origins (NO trailing slash).
# Only these sites may call the API. Add your production domain(s).
ALLOWED_ORIGINS = "https://jothidanipunar.com,https://jothida-nipunar.pages.dev,http://localhost:5173"

# Which ephemeris to use by default: "meeus" (in-Worker JS, fully self-contained)
# or "swiss" (proxy the high-precision Python backend, requires SWISS_BACKEND_URL).
EPHEMERIS_MODE = "meeus"

# KV namespace for rate-limit counters + JWKS cache.
# Create it: wrangler kv namespace create RL
# then paste the id below.
[[kv_namespaces]]
binding = "RL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[limits]
cpu_ms = 200

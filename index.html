<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="ஜோதிட நிபுணர் — தமிழ் ஜாதகம், 12 ராசி பலன், திருமண பொருத்தம், பஞ்சாங்கம், நல்ல நேரம், எண் கணிதம்." />
  <meta name="keywords" content="jothidam, astrology, vedic, horoscope, ஜோதிடம், ராசி, நட்சத்திரம், jathagam" />

  <!-- Open Graph -->
  <meta property="og:title" content="ஜோதிட நிபுணர் — Jothida Nipunar" />
  <meta property="og:description" content="Advanced Vedic Astrology with AI Predictions" />
  <meta property="og:type" content="website" />

  <title>ஜோதிட நிபுணர் — Jothida Nipunar</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Fonts: Noto Sans Tamil (body), Noto Serif Tamil (Tamil display), Cormorant (Latin display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@300;400;500;600;700;800&family=Noto+Serif+Tamil:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* ── Jothida Nipunar Design System — calm celestial palette ──
         மென்மையான navy + muted gold + வெண் பின்னணி. கண்ணை உறுத்தாத,
         அமைதியான தோற்றம்; எல்லா screen-க்கும் இதே tokens. */
      --jn-maroon:      #1f3f68;   /* primary (முன்பு மரூன் — இப்போது அமைதியான navy) */
      --jn-maroon-deep: #16304f;
      --jn-maroon-lit:  #35598c;
      --jn-gold:        #a9823c;   /* muted antique gold */
      --jn-gold-lit:    #c7a568;
      --jn-gold-soft:   #e2d2a8;
      --jn-ink:         #27303f;
      --jn-ink-soft:    #4a5365;
      --jn-ink-muted:   #76819a;
      --jn-line:        #e3e8f2;
      --jn-radius:      18px;
      --jn-shadow-sm:   0 2px 10px rgba(35,55,95,0.05);
      --jn-shadow-md:   0 10px 34px -12px rgba(35,55,95,0.14), 0 2px 8px rgba(35,55,95,0.04);
      --jn-shadow-gold: 0 10px 30px -8px rgba(170,140,85,0.28);
      --jn-ease:        cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Noto Sans Tamil', 'Segoe UI', system-ui, sans-serif;
      background: #ffffff;   /* pure white — section-வாரி வண்ணங்கள் cards-ல் */
      background-attachment: fixed;
      color: var(--jn-ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }

    /* Display type helpers (used via className on headings) */
    .jn-serif  { font-family: 'Noto Serif Tamil','Cormorant Garamond',serif; }
    .jn-latin  { font-family: 'Cormorant Garamond', serif; }

    /* Remove input spinners */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    /* Inputs — refined focus ring */
    input, select, textarea { font-family: inherit; transition: border-color .2s var(--jn-ease), box-shadow .2s var(--jn-ease), background .2s; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--jn-gold-lit) !important;
      box-shadow: 0 0 0 3px rgba(170,140,85,0.14) !important;
      background: #fcfdff !important;
    }
    input::placeholder { color: #a3adc2; }

    /* Buttons — universal micro-interaction */
    button { font-family: inherit; transition: transform .16s var(--jn-ease), box-shadow .2s var(--jn-ease), filter .2s, background .2s; -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):hover { filter: brightness(1.03); }
    button:not(:disabled):active { transform: scale(0.972); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cdd5e4; border-radius: 6px; }
    ::selection { background: rgba(170,140,85,0.20); }
    .jn-tabs::-webkit-scrollbar { display: none; }

    /* ── Reusable motion ── */
    @keyframes jnFadeUp   { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes jnFadeIn   { from { opacity:0; } to { opacity:1; } }
    @keyframes jnScaleIn  { from { opacity:0; transform: scale(.94); } to { opacity:1; transform: scale(1); } }
    @keyframes jnShimmer  { 0% { background-position: -180% 0; } 100% { background-position: 180% 0; } }
    @keyframes jnFloat    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes jnSpin     { to { transform: rotate(360deg); } }
    @keyframes jnGlowPulse{ 0%,100% { opacity:.55; } 50% { opacity:1; } }

    .jn-in       { animation: jnFadeUp .5s var(--jn-ease) both; }
    .jn-in-scale { animation: jnScaleIn .5s var(--jn-ease) both; }
    .jn-stagger > * { animation: jnFadeUp .5s var(--jn-ease) both; }
    .jn-stagger > *:nth-child(1){animation-delay:.03s} .jn-stagger > *:nth-child(2){animation-delay:.08s}
    .jn-stagger > *:nth-child(3){animation-delay:.13s} .jn-stagger > *:nth-child(4){animation-delay:.18s}
    .jn-stagger > *:nth-child(5){animation-delay:.23s} .jn-stagger > *:nth-child(6){animation-delay:.28s}

    /* Gold shimmer sweep — apply to a premium button as an overlay */
    .jn-shine { position: relative; overflow: hidden; }
    .jn-shine::after {
      content:""; position:absolute; inset:0;
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.22) 48%, transparent 66%);
      background-size: 220% 100%; animation: jnShimmer 5.2s var(--jn-ease) infinite;
      pointer-events:none;
    }
    /* Lift-on-hover card */
    .jn-lift { transition: transform .28s var(--jn-ease), box-shadow .28s var(--jn-ease); }
    .jn-lift:hover { transform: translateY(-3px); box-shadow: var(--jn-shadow-md); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

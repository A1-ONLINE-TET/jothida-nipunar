<head>

  <title>ஜோதிட நிபுணர் — Jothida Nipunar</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Fonts: Noto Sans Tamil (body), Noto Serif Tamil (Tamil display), Cormorant (Latin display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@300;400;500;600;700;800&family=Noto+Serif+Tamil:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* ── Jothida Nipunar Design System — sacred luxe palette ── */
      --jn-maroon:      #7b1c1c;
      --jn-maroon-deep: #5f1414;
      --jn-maroon-lit:  #9b2c2c;
      --jn-gold:        #b8860b;
      --jn-gold-lit:    #d4a017;
      --jn-gold-soft:   #e8c979;
      --jn-ink:         #241a15;
      --jn-ink-soft:    #4a3d35;
      --jn-ink-muted:   #7a6b60;
      --jn-line:        #ecdfce;
      --jn-radius:      18px;
      --jn-shadow-sm:   0 2px 10px rgba(90,40,10,0.06);
      --jn-shadow-md:   0 10px 34px -12px rgba(90,40,10,0.18), 0 2px 8px rgba(90,40,10,0.05);
      --jn-shadow-gold: 0 10px 30px -8px rgba(184,134,11,0.35);
      --jn-ease:        cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Noto Sans Tamil', 'Segoe UI', system-ui, sans-serif;
      background:
        radial-gradient(1100px 620px at 50% -12%, #fff6e2 0%, rgba(255,246,226,0) 60%),
        radial-gradient(900px 520px at 108% 8%, #fdeede 0%, rgba(253,238,222,0) 55%),
        radial-gradient(820px 560px at -8% 96%, #fbeeee 0%, rgba(251,238,238,0) 55%),
        linear-gradient(178deg, #fffdf8 0%, #fdf8ef 100%);
      background-attachment: fixed;
      color: var(--jn-ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }

    /* Display type helpers (used via className on headings) */
    .jn-serif  { font-family: 'Noto Serif Tamil','Cormorant Garamond',serif; }
    .jn-latin  { font-family: 'Cormorant Garamond', serif; }

    /* Remove input spinners */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    /* Inputs — refined focus ring */
    input, select, textarea { font-family: inherit; transition: border-color .2s var(--jn-ease), box-shadow .2s var(--jn-ease), background .2s; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--jn-gold) !important;
      box-shadow: 0 0 0 3px rgba(184,134,11,0.16) !important;
      background: #fffdf7 !important;
    }
    input::placeholder { color: #b3a596; }

    /* Buttons — universal micro-interaction */
    button { font-family: inherit; transition: transform .16s var(--jn-ease), box-shadow .2s var(--jn-ease), filter .2s, background .2s; -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):hover { filter: brightness(1.03); }
    button:not(:disabled):active { transform: scale(0.972); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(#e8c979,#b8860b); border-radius: 6px; }
    ::selection { background: rgba(184,134,11,0.22); }

    /* ── Reusable motion ── */
    @keyframes jnFadeUp   { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes jnFadeIn   { from { opacity:0; } to { opacity:1; } }
    @keyframes jnScaleIn  { from { opacity:0; transform: scale(.94); } to { opacity:1; transform: scale(1); } }
    @keyframes jnShimmer  { 0% { background-position: -180% 0; } 100% { background-position: 180% 0; } }
    @keyframes jnFloat    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes jnSpin     { to { transform: rotate(360deg); } }
    @keyframes jnGlowPulse{ 0%,100% { opacity:.55; } 50% { opacity:1; } }

    .jn-in       { animation: jnFadeUp .5s var(--jn-ease) both; }
    .jn-in-scale { animation: jnScaleIn .5s var(--jn-ease) both; }
    .jn-stagger > * { animation: jnFadeUp .5s var(--jn-ease) both; }
    .jn-stagger > *:nth-child(1){animation-delay:.03s} .jn-stagger > *:nth-child(2){animation-delay:.08s}
    .jn-stagger > *:nth-child(3){animation-delay:.13s} .jn-stagger > *:nth-child(4){animation-delay:.18s}
    .jn-stagger > *:nth-child(5){animation-delay:.23s} .jn-stagger > *:nth-child(6){animation-delay:.28s}

    /* Gold shimmer sweep — apply to a premium button as an overlay */
    .jn-shine { position: relative; overflow: hidden; }
    .jn-shine::after {
      content:""; position:absolute; inset:0;
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.42) 48%, transparent 66%);
      background-size: 220% 100%; animation: jnShimmer 3.6s var(--jn-ease) infinite;
      pointer-events:none;
    }
    /* Lift-on-hover card */
    .jn-lift { transition: transform .28s var(--jn-ease), box-shadow .28s var(--jn-ease); }
    .jn-lift:hover { transform: translateY(-3px); box-shadow: var(--jn-shadow-md); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
